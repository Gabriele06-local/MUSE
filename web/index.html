<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MUSE — a dreamy digital museum of quotes and lives. 1000+ quotes in English and Italian, offline, minimal.">
  <meta name="theme-color" content="#07080D">

  <!-- Open Graph -->
  <meta property="og:title" content="MUSE — a dreamy museum of quotes">
  <meta property="og:description" content="Discover memorable quotes and short biographies. English and Italian, offline, minimal.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://gabriele06-local.github.io/MUSE/logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MUSE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MUSE — a dreamy museum of quotes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #07080D; margin: 0; height: 100%; }
    #muse-loader {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #07080D;
      transition: opacity .4s ease; z-index: 9999;
    }
    #muse-loader img { width: 148px; height: 148px; }
  </style>
</head>
<body>
  <div id="muse-loader"><img src="logo.png" alt="MUSE"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('muse-loader');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
